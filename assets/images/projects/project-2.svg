<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" fill="url(#p2Grad)" rx="12" />

  <!-- Mobile Screen 1 (Left perspective) -->
  <g transform="translate(140, 40)">
    <rect x="0" y="0" width="150" height="300" rx="20" fill="#020617" stroke="#334155" stroke-width="4" />
    <rect x="10" y="10" width="130" height="280" rx="14" fill="#ffffff" />
    <!-- Notch -->
    <rect x="50" y="14" width="50" height="8" rx="4" fill="#020617" />
    <!-- Content -->
    <rect x="25" y="40" width="70" height="8" rx="2" fill="#64748b" />
    <rect x="25" y="55" width="100" height="14" rx="3" fill="#0f172a" />
    <!-- Wallet Card -->
    <rect x="20" y="80" width="110" height="70" rx="8" fill="url(#phoneCardGrad)" />
    <circle cx="35" cy="98" r="8" fill="#ffffff" opacity="0.3" />
    <rect x="28" y="125" width="60" height="6" rx="2" fill="#ffffff" />
    <rect x="28" y="135" width="40" height="6" rx="2" fill="#ffffff" opacity="0.7" />
    <!-- Quick Actions -->
    <circle cx="38" cy="175" r="14" fill="#f1f5f9" />
    <circle cx="75" cy="175" r="14" fill="#f1f5f9" />
    <circle cx="112" cy="175" r="14" fill="#f1f5f9" />
    <!-- Transactions List -->
    <rect x="20" y="205" width="110" height="22" rx="4" fill="#f8fafc" />
    <rect x="20" y="235" width="110" height="22" rx="4" fill="#f8fafc" />
    <rect x="20" y="265" width="110" height="20" rx="4" fill="#f8fafc" />
  </g>

  <!-- Mobile Screen 2 (Right perspective) -->
  <g transform="translate(310, 40)">
    <rect x="0" y="0" width="150" height="300" rx="20" fill="#020617" stroke="#334155" stroke-width="4" />
    <rect x="10" y="10" width="130" height="280" rx="14" fill="#0f172a" />
    <!-- Notch -->
    <rect x="50" y="14" width="50" height="8" rx="4" fill="#020617" />
    <!-- Analytics chart inside app -->
    <rect x="25" y="40" width="90" height="10" rx="2" fill="#ffffff" />
    <rect x="25" y="60" width="60" height="18" rx="3" fill="#38bdf8" />
    <!-- Mini Graph -->
    <path d="M 25 150 Q 50 110, 75 130 T 125 90" fill="none" stroke="#818cf8" stroke-width="3" />
    <path d="M 25 150 Q 50 110, 75 130 T 125 90 L 125 160 L 25 160 Z" fill="#818cf8" opacity="0.15" />
    <!-- Category Items -->
    <rect x="20" y="175" width="110" height="30" rx="6" fill="#1e293b" />
    <circle cx="35" cy="190" r="8" fill="#10b981" />
    <rect x="50" y="186" width="50" height="8" rx="2" fill="#cbd5e1" />
    
    <rect x="20" y="215" width="110" height="30" rx="6" fill="#1e293b" />
    <circle cx="35" cy="230" r="8" fill="#f59e0b" />
    <rect x="50" y="226" width="50" height="8" rx="2" fill="#cbd5e1" />

    <rect x="20" y="255" width="110" height="25" rx="6" fill="#6366f1" />
  </g>
</svg>

